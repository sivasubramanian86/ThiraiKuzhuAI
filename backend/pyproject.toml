[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "thirai-kuzhu-ai-backend"
version = "0.1.0"
description = "Thirai Kuzhu AI — Autonomous Screen Crew AI for Cinematic Observability"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [
    { name = "Sivasubramanian", email = "developer@thiraikuzhu.ai" }
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "google-genai>=1.0.0",
    "google-cloud-aiplatform>=1.70.0",
    "google-cloud-translate>=3.15.0",
    "google-cloud-texttospeech>=2.16.0",
    "google-cloud-secret-manager>=2.20.0",
    "mcp>=1.3.0",
    "openlit>=1.20.0",
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
    "httpx>=0.28.0",
    "sse-starlette>=2.1.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "pytest-mock>=3.15.0",
    "ruff>=0.9.0",
    "bandit[toml]>=1.8.0",
    "black>=24.10.0",
    "poetry>=2.0.0",
    "uv>=0.9.0"
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["**/__pyrefly_virtual__/**", "**/__pycache__/**", ".pytest_cache", ".venv"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "ANN", "S", "D"]
ignore = ["D100", "D104", "S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S106", "ANN401"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.bandit]
exclude_dirs = ["tests", ".pytest_cache", ".venv"]
skips = ["B101"]

[tool.pytest.ini_options]
minversion = "8.0"
pythonpath = ["."]
addopts = "-ra -q --cov=src --cov-report=term-missing --cov-fail-under=100"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.hatch.build.targets.wheel]
packages = ["src"]

